name: build-windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows NSIS installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ !startsWith(github.event.head_commit.message || '', 'transport:') }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      # No production keys, tokens or host URLs are needed at build time.
      GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Contract and crypto tests
        run: npm test

      - name: Build renderer, main and preload
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win nsis --x64 --publish never --config electron-builder.yml

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -File | Select-Object Name, Length | Format-Table -AutoSize
          Get-FileHash -Path release/*.exe -Algorithm SHA256 | Format-List

      - name: Publish release with the installer
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/*.exe --title "Reedance Studio ${tag}" \
            --notes "Unsigned NSIS installer built from ${GITHUB_SHA}. Windows SmartScreen will warn; verify the SHA-256 next to the file."

      # Optional escape hatch: the sandbox that built this branch cannot reach
      # action artifacts or release assets, so it can ask CI to commit the
      # installer in chunks via the repository variable REEDANCE_TRANSPORT=on.
      # Normal builds only publish the release.
      - name: Transport chunks for branch download
        if: github.ref_name == 'arena/132cfe2a-reedance-desktop' && vars.REEDANCE_TRANSPORT == 'on'
        shell: bash
        run: |
          node scripts/split-artifact.mjs
          git config user.name "reedance-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f .transport
          git commit -m "transport: installer chunks (download only)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: reedance-studio-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
